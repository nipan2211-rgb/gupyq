<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#f4f7ff;
    color:#222;
}

/* =========================
   HEADER
========================= */

header{
    background:linear-gradient(135deg,#1b1f5e,#3949ab);
    color:white;
    padding:35px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

header h1{
    font-size:34px;
    margin-bottom:8px;
}

header p{
    font-size:15px;
    opacity:0.9;
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

/* =========================
   CARD
========================= */

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

/* =========================
   TITLE
========================= */

.program-title{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.program-icon{
    width:60px;
    height:60px;
    background:#ffffff;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    color:#3949ab;
}

.program-title h2{
    font-size:28px;
    color:#1b1f5e;
}

/* =========================
   DETAILS
========================= */

details{
    margin-bottom:14px;
    background:#d1e2f0;
    border:1px solid #beb4f7;
    border-radius:10px;
    overflow:hidden;
}

summary{
    padding:15px 18px;
    font-weight:600;
    cursor:pointer;
    position:relative;
    list-style:none;
    transition:0.3s;
}

/* Remove browser default arrow */
summary::-webkit-details-marker{
    display:none;
}

summary::marker{
    display:none;
}

summary:hover{
    background:#eef1ff;
}

/* Plus icon */
summary::after{
    content:"+";
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:20px;
    font-weight:600;
}

/* Minus icon when opened */
details[open] > summary::after{
    content:"−";
}

/* =========================
   CONTENT
========================= */

.year{
    padding:15px 18px;
    background:rgb(230,234,245);
    border-top:1px solid #e5e5e5;
}

/* =========================
   YEAR ROW
========================= */

.year-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    padding:12px 0;
    border-bottom:1px dashed #ddd;
    gap:10px;
}

.year-row:last-child{
    border-bottom:none;
}

.year-text{
    font-weight:600;
    color:#1b1f5e;
}

/* =========================
   BUTTONS
========================= */

.links{
    display:flex;
    gap:10px;
}

.links a{
    text-decoration:none;
    padding:8px 14px;
    border-radius:6px;
    font-size:14px;
    color:white;
    transition:0.3s;
}

.final-btn{
    background:#3949ab;
}

.final-btn:hover{
    background:#283593;
}

.sessional-btn{
    background:#5c6bc0;
}

.sessional-btn:hover{
    background:#3f51b5;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:20px;
    color:#666;
    font-size:14px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header h1{
        font-size:26px;
    }

    .program-title h2{
        font-size:22px;
    }

    .year-row{
        align-items:flex-start;
    }

    .links{
        width:100%;
    }

}

/* =========================
   GOOGLE DRIVE BUTTON
========================= */

.links a{
    cursor:pointer;
}

/* Make Drive links open normally */
.links a[href*="drive.google.com"]{
    text-decoration:none;
}
