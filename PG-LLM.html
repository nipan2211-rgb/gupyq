<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:#f7f5ff;
color:#222;
}

/* HEADER */

header{
background:linear-gradient(135deg,#3b0764,#6d28d9);
color:white;
padding:35px 20px;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

header h1{
font-size:34px;
margin-bottom:8px;
}

header p{
font-size:15px;
opacity:0.9;
}

/* CONTAINER */

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

/* CARD */

.card{
background:white;
border-radius:18px;
padding:25px;
box-shadow:0 6px 18px rgba(12, 12, 12, 0.08);
}

/* TITLE */

.program-title{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
}

.program-icon{
width:60px;
height:60px;
background:#ede9fe;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:#6d28d9;
}

.program-title h2{
font-size:28px;
color:#3b0764;
}

/* DETAILS */

details{
margin-bottom:14px;
background:#faf8ff;
border:1px solid #e5ddff;
border-radius:10px;
overflow:hidden;
}

summary{
padding:15px 18px;
font-weight:600;
cursor:pointer;
position:relative;
list-style:none;
transition:0.3s;
}

summary:hover{
background:#f1ebff;
}

summary::after{
content:"+";
position:absolute;
right:18px;
font-size:20px;
}

details[open] summary::after{
content:"âˆ’";
}

/* CONTENT */

.year{
padding:15px 18px;
background:white;
border-top:1px solid #e5e5e5;
}

/* YEAR ROW */

.year-row{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
padding:12px 0;
border-bottom:1px dashed #ddd;
gap:10px;
}

.year-row:last-child{
border-bottom:none;
}

.year-text{
font-weight:600;
color:#3b0764;
}

/* BUTTONS */

.links{
display:flex;
gap:10px;
}

.links a{
text-decoration:none;
padding:8px 14px;
border-radius:6px;
font-size:14px;
color:white;
transition:0.3s;
}

.final-btn{
background:#6d28d9;
}

.final-btn:hover{
background:#5b21b6;
}

.sessional-btn{
background:#8b5cf6;
}

.sessional-btn:hover{
background:#7c3aed;
}

/* FOOTER */

footer{
text-align:center;
padding:20px;
color:#666;
font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

header h1{
font-size:26px;
}

.program-title h2{
font-size:22px;
}

}
</style>
